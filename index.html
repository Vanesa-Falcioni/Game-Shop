<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./img/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"
      integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/modern-normalize@1.1.0/modern-normalize.min.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Game Shop</title>
  </head>

  <body>
    <header>
      <!-- Logo -->
      <div class="logo">
        <img src="./img/Logo.png" alt="logo gameshop" />
      </div>
      <!-- Menu de navegacion -->
      <nav id="menu-principal">
        <ul>
          <li><a href="#">Categorias</a></li>
          <li><a href="#">Ofertas</a></li>
          <li><a href="#">Moda</a></li>
          <li><a href="#">Favoritos</a></li>
        </ul>
      </nav>
      <!-- Carrito -->
      <a href="index.html#carrito" class="cart" aria-label="Ver carrito"
        ><i class="fa-solid fa-cart-shopping" aria-hidden="true"></i
      ></a>
      <button class="hamb" type="button" aria-label="Abrir menú">
        <i class="fa-solid fa-bars"></i>
      </button>
    </header>
    <main>
      <!-- seccion slide -->
      <section class="slide">
        <div class="contenido-slide">
          <h2><span>25%</span> de descuento en juegos de playstation 4</h2>
          <a href="#ofertas" class="btn-comprar">Comprar</a>
        </div>
      </section>
      <!-- seccion productos -->
      <section class="product">
        <h2>Productos Destacados</h2>
        <!-- primer tarjeta -->
        <div class="contenedor-productos">
          <article class="tarjeta-producto">
            <img src="./img/Fifa.png" alt="Tarjeta FIFA 21" />
          </article>
          <!-- segunda tarjeta -->
          <article class="tarjeta-producto">
            <img src="./img/Detroit.png" alt="Tarjeta Detroit" />
          </article>
          <!-- tercera tarjeta -->
          <article class="tarjeta-producto">
            <img src="./img/Mortal Combat.png" alt="Tarjeta Mortal Kombat " />
          </article>
        </div>
      </section>
      <!-- seccion banner - productos estrellas -->
      <section class="section-banner">
        <h2>Productos estrellas</h2>
        <!-- imagenes dentro del banner -->
        <div class="contenedor-banners">
          <!-- Sillas Gamer -->
          <article class="banner-card">
            <img src="./img/Sillas Gamer.png" alt="Sillas Gamer" />
          </article>
          <!-- Computadoras -->
          <article class="banner-card">
            <img src="./img/Computadoras.png" alt="Computadoras" />
          </article>
        </div>
      </section>
    </main>
    <!-- footer -->
    <footer class="footer">
      <div class="contenido-footer">
        <!-- Logo -->
        <div class="logo">
          <img src="./img/Logo.png" alt="logo gameshop" />
        </div>

        <!-- Redes Sociales -->
        <div class="columna-footer redes-footer">
          <h3>Redes sociales</h3>
          <div class="iconos-redes">
            <a href="#" aria-label="Twitter"
              ><i class="fa-brands fa-twitter"></i
            ></a>
            <a href="#" aria-label="Facebook"
              ><i class="fa-brands fa-facebook-f"></i
            ></a>
            <a href="#" aria-label="Instagram"
              ><i class="fa-brands fa-instagram"></i
            ></a>
          </div>
        </div>
      </div>

      <!-- COPY ADENTRO DEL FOOTER -->
      <div class="copy">
        <p>Todos los derechos reservados a TDW</p>
      </div>
    </footer>

    <script src="./js/script.js"></script>
  </body>
</html>
